<div class="mm-ending-soon-filter" [id]="fieldId">
  <ul class="filter-options">
    <li
      *ngFor="let days of dayOptions"
      [class.selected]="filter?.selected.has(days)"
      [class.disabled]="disabled">
      <label>
        <input
          type="radio"
          name="ending-soon-filter"
          [value]="days"
          [checked]="filter?.selected.has(days)"
          [disabled]="disabled"
          (change)="toggle(days)"
        />
        {{ 'tasks.sidebar.filter.ending_soon.within_' + days + '_days' | translate }}
      </label>
    </li>
  </ul>
</div>
